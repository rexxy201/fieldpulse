name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fieldpulse_test
          MYSQL_USER: fieldpulse_test
          MYSQL_PASSWORD: test_pw_12345
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Load schema
        run: mysql -h 127.0.0.1 -u fieldpulse_test -ptest_pw_12345 fieldpulse_test < database/schema.sql

      - name: Run PHPUnit
        env:
          FIELDPULSE_DB_HOST: 127.0.0.1
          FIELDPULSE_DB_NAME: fieldpulse_test
          FIELDPULSE_DB_USER: fieldpulse_test
          FIELDPULSE_DB_PASS: test_pw_12345
        run: vendor/bin/phpunit --testdox
